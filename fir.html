<pre id="firOutput"></pre>

<h2>🚓 Find Nearby Police Station</h2>

<input type="text" id="locationInput" placeholder="Enter your location (e.g. Kolkata)">
<br><br>

<button onclick="findPolice()">Find Police Stations</button>

<script>
function findPolice() {
    const location = document.getElementById("locationInput").value;

    if (!location) {
        alert("Please enter a location");
        return;
    }

    // ✅ Opens Google Maps directly
    const url = "https://www.google.com/maps/search/police+station+near+" 
                + encodeURIComponent(location);

    window.open(url, "_blank");
}
</script>
